[project]
name = "studio"
version = "0.1.0"
description = "XiGee Studio — 数据管理后端"
readme = "README.md"
requires-python = ">=3.13"
# PEP 639: license 用 SPDX 表达式; LICENSE 在仓库根目录(studio/ 之外),
# 所以 license-files 显式置空, 否则打包会去找 studio/LICENSE* 并落空。
license = "MIT"
license-files = []
keywords = ["xigee", "ai-tools", "ai-directory", "fastapi", "sqlalchemy", "mysql"]
classifiers = [
    # 私有应用, 防止误发到 PyPI
    "Private :: Do Not Upload",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.143.0,<1.0",
    "uvicorn[standard]>=0.54.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "aiomysql>=0.2.0,<1.0",
    # MySQL 8 的默认认证插件是 caching_sha2_password, 而 prod 库就是 8.0。
    # 非 TLS 连接下 caching_sha2 的 full auth 分支要用服务端公钥做 RSA 加密密码,
    # PyMySQL 只在装了 cryptography 时才实现它(见 pymysql/_auth.py 的 _have_cryptography)。
    # 缺了这行, prod 会在首次连接(以及 FLUSH PRIVILEGES / 服务端重启之后)抛
    # RuntimeError: 'cryptography' package is required ... —— 那既不是我们用
    # OperationalError 兜住的"库不可用", 也不是能重试的错误。
    # dev 库是 5.7(mysql_native_password), 本地测试永远走不到这条路径, 只能靠声明兜住。
    "cryptography>=44.0.0,<48.0",
    "pydantic>=2.14.1,<3.0",
    "pydantic-settings>=2.15.0,<3.0",
    "url-normalize>=3.0.1,<4.0",
]

# PEP 621 的链接字段。填的是 monorepo 根地址 —— studio 不是独立仓库, 单独指向
# studio/ 会让 Homepage 与 Issues 落到错的地方; 与根 package.json 的
# homepage / repository / bugs 保持同一组 URL。
[project.urls]
Homepage = "https://www.xigee.net"
Repository = "https://github.com/sopwise-ai/xigee"
Issues = "https://github.com/sopwise-ai/xigee/issues"
Documentation = "https://github.com/sopwise-ai/xigee/tree/main/studio#readme"

[build-system]
# hatchling >= 1.27 才支持 PEP 639 的 license / license-files
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "pytest>=9.1.1",
    # >= 1.0: pyproject 的 [tool.pytest.ini_options] 用了 asyncio_default_fixture_loop_scope,
    # 配合 --strict-config, 老版本不认这个 ini 键会直接报错。声明就要声明实测过的那条线。
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.1",
    # >= 2.4: 与 ruff/pytest 同一条口径 —— 只声明实测过的那条线
    "mypy>=2.4",
]

[tool.uv]
# uv 版本下限的唯一事实源。低于它 uv 自己会拒绝执行(sync / lock / build 全都过不去):
#   error: Required uv version `>=0.11.30` does not match the running version ...
# 取 0.11.30 是因为 CI 固定的就是它(studio-ci.yml 的 setup-uv version)。这个值是
# README「环境要求」那一行的依据, 改动要连着 CI 一起改 —— 在此之前三处口径不一
# (README 写 >= 0.11 / CONTRIBUTING 写 "最新" / CI 固定 0.11.30)且没有任何东西执行它。
required-version = ">=0.11.30"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# ASYNC: 拦住异步函数里的阻塞调用(time.sleep/open/requests) —— 这类问题在
#        FastAPI 里表现为整个事件循环被卡住, 本地小数据量测不出来。
# LOG  : logging 用法(exc_info 位置、warn vs warning、f-string 形式化参数)
# G    : 同上, 偏 logging 格式串
# PT   : flake8-pytest-style, 测试写法统一(pytest.raises 块、断言拆分)
# TID  : 禁止相对导入; 全仓用 app.* 绝对导入, 否则同一模块会被导入两次
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "C4", "RET", "SIM", "RUF", "T20", "ASYNC", "LOG", "G", "PT", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "RUF002", "RUF003"]
"app/api/**" = ["B008"]
# 下面两处的 LOCAL_HOSTS 是【地址白名单】而不是监听地址,flake8-bandit 误报(S104)
"app/utils/url.py" = ["S104"]
"app/schemas/models.py" = ["S104"]

[tool.ruff.lint.isort]
# 显式声明, 不依赖 detect_same_package 的推断(它只在同包内生效, 加个 src/ 目录就失效)
known-first-party = ["app"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
# strict 全家桶(disallow_untyped_defs / disallow_any_generics / warn_return_any /
# no_implicit_optional / strict_equality ...)。一项项列容易漏, 直接用 strict;
# 需要豁免的地方在下面逐条写明理由, 不做全局放宽。
strict = true
# app/ 全量 strict; tests/ 另有一层放宽, 见下面的 overrides。
files = ["app", "tests"]
# pydantic 插件: 没有它, BaseSettings 子类的 __init__ 会被当成"所有字段都必填",
# Settings() 这种全靠默认值的调用会误报 missing named argument。
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# aiomysql 与 PyMySQL 都不带 py.typed, 也没有可用的 types-* 存根
# (mypy 的原话是 "Missing library stubs or py.typed marker"), 只能按 Any 处理。
# 影响面可控: 两个包都只在 app/core/database.py 里出现。
module = ["aiomysql.*", "pymysql.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# tests/ 只查"会真的出错"的类型问题, 不强制每个用例都写签名 —— pytest 本来就用
# fixture 注入参数, 全量 strict 在 tests/ 上是 311 个 no-untyped-def, 全是噪音。
# 这一层照样抓到了实打实的东西: conftest 里 app_env == "test" 的死分支、
# test_health 里拿字符串冒充 DBAPI 异常、以及把 SimpleNamespace 当真的 Tool 传进去。
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# test_models 整篇都在钉"StrEnum 成员 == 库里那一列的字面量"。这个等式在运行期就是
# True(str 子类的 == 语义), mypy 却认为两边类型永不重叠 —— 是它不认识 StrEnum,
# 不是代码有问题。只在这一个文件里关掉 strict_equality, 其余测试文件仍然开着。
module = ["tests.test_models"]
strict_equality = false

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
asyncio_mode = "auto"
# 显式钉死异步 fixture 的事件循环作用域。不写这行 pytest-asyncio 会发
# PytestDeprecationWarning, 而且未来版本会把默认值从 "fixture" 改成 "function" ——
# 到那天行为会静默变化, 而本套件每个用例都要 TRUNCATE, 必须用例级隔离。
asyncio_default_fixture_loop_scope = "function"
# --strict-config: pyproject 里写错的 ini 键直接报错, 而不是被静默忽略
addopts = "--strict-markers --strict-config"
# 弃用警告一律升级为错误。【已经定位到具体来源且短期修不掉】的条目才允许逐条放行;
# 这里此前是 ignore::DeprecationWarning, 结果把我们自己代码里
# HTTP_422_UNPROCESSABLE_ENTITY 的弃用警告一并吞了(CI 里表现为 17 次静默通过)。
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/exporters/__main__.py"]

[tool.coverage.report]
show_missing = true
precision = 2
# 定这个门槛时的实测值(dev 库 + MySQL 5.7, branch = true)是 76.12%。往下留两个点,
# 起"棘轮"作用而不是每次微调都变红 —— 要往上抬就得先补测试。
fail_under = 74
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
