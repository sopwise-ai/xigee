name: Studio CI

# 与 web-ci 一样刻意不加 paths 过滤: main 的分支保护要求检查通过才能合并,
# 只在 studio/** 变更时运行会让其他模块的 PR 永远等不到这个检查。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动触发: 想在某个分支上单独验一次(改 CI 自身、或排查一次假的失败)时用:
  #   gh workflow run studio-ci.yml --ref <branch>
  # ⚠️ GitHub 要求 workflow_dispatch 必须已经出现在【默认分支】上才可派发,
  #    所以本文件合并进 main 之前, 这条命令会报 404 (workflow ... not found on
  #    the default branch)。在那之前只能靠 PR 触发。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ⚠️ job id 与 name 都不是 "ci": 那是 web-ci 里 required check 的名字, 重名会让
  # 两个工作流产生同名检查, 规则集就可能被"另一个 ci 通过了"满足。
  # 上线后需要在 main 的规则集里把 "studio (ruff + pytest)" 也设为 required。
  studio:
    name: studio (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: studio

    # 用 MySQL 8.0 而不是 dev 库的 5.7: prod 就是 8.0, 而 8.0 的默认认证插件是
    # caching_sha2_password —— 这条路径在 5.7 上永远跑不到(见 tests/test_dependencies.py
    # 与 pyproject.toml 里 cryptography 的注释)。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: xigee_test
          MYSQL_USER: xigee
          MYSQL_PASSWORD: xigee
        ports:
          # 刻意映射到 3307 而不是 3306: runner 镜像预装了 MySQL 8.0.46(当前
          # "disabled by default", 但历史上曾默认启动并顶掉声明在 3306 的服务,
          # 见 actions/runner-images#2889)。换一个宿主端口, 两种情况都安全。
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: dev
      APP_DEBUG: "true"
      LOG_LEVEL: INFO
      DB_HOST: 127.0.0.1
      DB_PORT: "3307"
      # 库名含 test => tests/conftest.py 的破坏性测试门禁自动放行, 不需要额外开关
      DB_NAME: xigee_test
      DB_USER: xigee
      DB_PASSWORD: xigee
      # 以下两个只是让 Settings 校验通过的一次性值, 不是密钥
      API_KEY: ci-not-a-secret
      CORS_ORIGINS: http://localhost:3000

    steps:
      # 所有 action 按 commit SHA 固定(与 web-ci / workflow-lint 同一约定),
      # 版本写在行尾注释里, 由 Dependabot 的 github-actions 生态持续更新。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # 固定 uv 版本而不是跟随 latest: 本作业是 required check,
          # 不能因为上游工具换版本就无故变红(与 workflow-lint.yml 装 shellcheck 同一理由)。
          # 升级时同步更新本文件与 README 的「环境要求」。
          version: "0.11.30"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-progress

      - name: Lint
        run: uv run ruff check app/ tests/

      - name: Format check
        run: uv run ruff format --check app/ tests/

      # 与本地 make check 跑同一份 [tool.mypy](strict + pydantic 插件);
      # tests/ 用放宽的一层, 理由写在 pyproject 的 overrides 注释里
      - name: Type check
        run: uv run mypy app/ tests/

      # 先单独打一次库。schema.sql 没进库 / 认证方式不对 / 端口映射错了, 都在这里
      # 报出来, 而不是混在 400 个用例的第一条 fixture 里。
      # 用服务容器自带的客户端灌 DDL: services 是在 checkout 之前启动的, 所以
      # 不能靠挂载 studio/sql/schema.sql 到 docker-entrypoint-initdb.d 来做这件事。
      - name: Apply schema
        run: |
          docker exec -i "${{ job.services.mysql.id }}" \
            mysql --user=root --password=root --default-character-set=utf8mb4 xigee_test < sql/schema.sql

      - name: Smoke test DB connection
        run: |
          uv run python - <<'PY'
          import asyncio

          from sqlalchemy import text

          from app.core.database import engine


          async def main() -> None:
              async with engine.connect() as conn:
                  version = (await conn.execute(text("SELECT VERSION()"))).scalar()
              await engine.dispose()
              print("connected to MySQL", version)


          asyncio.run(main())
          PY

      # term-missing 的表在 CI 日志里会换行, 逐文件行号读不出来(踩过: 同一个文件里
      # "44 行缺失而 45 行有覆盖"这种自相矛盾)。所以另外产出 JSON 并上传 artifact:
      # 要按覆盖率挑弱文件时, 以那份 JSON 为准, 别读日志里的表。
      - name: Test
        run: uv run pytest -q --cov=app --cov-report=term-missing --cov-report=json:coverage.json

      - name: Upload coverage data
        # 失败时更要看覆盖率(用例没跑到的分支往往就是失败的原因), 所以 always()
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-coverage
          path: studio/coverage.json
          if-no-files-found: warn
          retention-days: 7
